name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API lint & pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -e services/optimizer
          pip install -e services/simulator
          pip install -e services/agent
          pip install -r services/api/requirements.txt
          pip install -e services/api
          pip install -e services/mcp-server
          pip install pytest pytest-asyncio ruff

      - name: Ruff
        working-directory: ${{ github.workspace }}/services/api
        run: ruff check app tests

      - name: Pytest (unit)
        working-directory: ${{ github.workspace }}/services/api
        env:
          PYTHONPATH: ${{ github.workspace }}/services/api
        run: pytest -q

      - name: Pytest (integration)
        working-directory: ${{ github.workspace }}/tests/integration
        env:
          PYTHONPATH: ${{ github.workspace }}/services/api
        run: pytest -q

      - name: Safety regression (optimizer package)
        working-directory: ${{ github.workspace }}
        run: pytest -q services/api/tests/test_safety.py

  web:
    name: Web typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @twinpilot/web typecheck

      - name: Lint
        run: pnpm --filter @twinpilot/web lint
