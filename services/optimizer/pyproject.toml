[project]
name = "twinpilot-optimizer"
version = "0.1.0"
description = "TwinPilot optimization, safety shield, and confidence scoring"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["twinpilot_optimizer*"]
