[project]
name = "twinpilot-api"
version = "0.1.0"
description = "TwinPilot FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0,<4.1",
  "python-multipart>=0.0.20",
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "httpx>=0.28",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14"]
# Install sibling packages separately:
#   pip install -e ../optimizer -e ../simulator -e ../agent

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
